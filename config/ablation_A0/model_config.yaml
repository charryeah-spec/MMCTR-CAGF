DIN_ablation_A0_001:
  model: DIN
  dataset_id: MicroLens_1M_x1
  loss: binary_crossentropy
  metrics:
  - AUC
  - logloss
  task: binary_classification
  optimizer: adam
  learning_rate: 0.001
  embedding_regularizer: 1.0e-06
  net_regularizer: 0
  net_dropout: 0.1
  batch_size: 8192
  embedding_dim: 64
  dnn_hidden_units:
  - 1024
  - 512
  - 256
  dnn_activations: ReLU
  attention_hidden_units:
  - 512
  - 256
  attention_hidden_activations: ReLU
  attention_output_activation: null
  attention_dropout: 0.1
  din_use_softmax: false
  batch_norm: true
  epochs: 100
  shuffle: true
  seed: 20242025
  monitor: AUC
  monitor_mode: max
  max_len: 64
  accumulation_steps: 1
  early_stop_patience: 3
  num_workers: 3
  model_root: ./checkpoints/
  pickle_feature_encoder: true
  save_best_only: true
  eval_steps: null
  debug_mode: false
  group_id: user_id
  use_features: null
  feature_specs: null
  feature_config: null
  verbose: 1
