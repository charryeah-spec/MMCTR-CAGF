Base:
    model_root: './checkpoints/'
    num_workers: 6
    verbose: 1
    early_stop_patience: 5
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: user_id
    use_features: null
    feature_specs: null
    feature_config: null

Transformer_DCN_default:
    model: Transformer_DCN
    dataset_id: TBD
    loss: 'binary_crossentropy'
    metrics: [AUC, logloss]
    task: binary_classification
    optimizer: adam
    learning_rate: 3.0e-4
    embedding_regularizer: 1.0e-6
    net_regularizer: 0
    batch_size: 256
    embedding_dim: 64
    item_project_dim: 128
    transformer_layers: 3
    num_heads: 4
    transformer_dropout: 0.15
    short_k: 16
    cross_layers: 3
    cross_dropout: 0.15
    dnn_hidden_units: [1024, 512, 256]
    dnn_activations: ReLU
    net_dropout: 0.15
    batch_norm: True
    epochs: 100
    shuffle: True
    seed: 20242025
    monitor: "AUC"
    monitor_mode: 'max'
    max_len: 64
    accumulation_steps: 1
