<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Confidence-Aware Gated Fusion method</title>
  <desc id="desc">Four embedding sources produce confidence and geometry features for a per-item gate trained with leave-one-source-out reconstruction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071729"/><stop offset="1" stop-color="#153954"/></linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13b8b1"/><stop offset="1" stop-color="#3f7cff"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#80a8c2"/></marker>
    <filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-opacity=".24"/></filter>
    <style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.h{font-size:29px;font-weight:760;fill:#f5fbff}.label{font-size:18px;font-weight:650;fill:#ecf7ff}.small{font-size:14px;fill:#9ab8ca}.box{fill:#12324b;stroke:#2f607d;stroke-width:1.5}.line{fill:none;stroke:#80a8c2;stroke-width:2;marker-end:url(#a)}</style>
  </defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="58" y="58" class="t h">CAGF · Confidence-Aware Gated Fusion</text>
  <text x="58" y="86" class="t small">Per-item source reliability · label-free offline training · no gradient through the CTR model</text>

  <text x="58" y="138" class="t" font-size="14" font-weight="750" letter-spacing="2" fill="#45d8ce">FOUR 128-D SOURCES</text>
  <g filter="url(#s)">
    <rect x="58" y="166" width="240" height="70" rx="14" class="box"/><circle cx="83" cy="201" r="7" fill="#4addd2"/><text x="104" y="197" class="t label">Official semantic</text><text x="104" y="219" class="t small">confidence = 1</text>
    <rect x="58" y="252" width="240" height="70" rx="14" class="box"/><circle cx="83" cy="287" r="7" fill="#4addd2"/><text x="104" y="283" class="t label">RQ reconstruction</text><text x="104" y="305" class="t small">original ↔ RQ cosine</text>
    <rect x="58" y="338" width="240" height="70" rx="14" class="box"/><circle cx="83" cy="373" r="7" fill="#4addd2"/><text x="104" y="369" class="t label">Behavior SVD</text><text x="104" y="391" class="t small">interaction support confidence</text>
    <rect x="58" y="424" width="240" height="70" rx="14" class="box"/><circle cx="83" cy="459" r="7" fill="#4addd2"/><text x="104" y="455" class="t label">MM ensemble</text><text x="104" y="477" class="t small">variant agreement</text>
  </g>

  <path d="M298 201C340 201 344 298 386 298" class="line"/><path d="M298 287L386 310" class="line"/><path d="M298 373L386 322" class="line"/><path d="M298 459C346 459 348 334 386 334" class="line"/>
  <g filter="url(#s)"><rect x="398" y="202" width="285" height="226" rx="20" class="box"/><text x="540" y="248" text-anchor="middle" class="t label">Reliability feature vector</text><text x="430" y="284" class="t small">• source availability</text><text x="430" y="313" class="t small">• intrinsic confidence</text><text x="430" y="342" class="t small">• mean agreement / disagreement</text><text x="430" y="371" class="t small">• official-anchor similarity</text><text x="430" y="400" class="t small">• six pairwise cosine scores</text></g>
  <path d="M683 315L756 315" class="line"/>
  <g filter="url(#s)"><rect x="772" y="224" width="222" height="182" rx="22" fill="url(#gate)"/><text x="883" y="272" text-anchor="middle" class="t" font-size="22" font-weight="760" fill="#fff">Residual MLP gate</text><text x="883" y="306" text-anchor="middle" class="t" font-size="15" fill="#e8fbff">log-confidence prior</text><text x="883" y="333" text-anchor="middle" class="t" font-size="15" fill="#e8fbff">+ learned correction</text><rect x="813" y="359" width="140" height="7" rx="4" fill="#d8ffff" opacity=".86"/></g>
  <path d="M994 315L1050 315" class="line"/>
  <g filter="url(#s)"><rect x="1066" y="196" width="270" height="238" rx="20" class="box"/><text x="1201" y="242" text-anchor="middle" class="t label">Item-specific weights</text><text x="1100" y="282" class="t small">w₁ · official</text><rect x="1212" y="271" width="89" height="11" rx="6" fill="#3bd3c7"/><text x="1100" y="316" class="t small">w₂ · RQ</text><rect x="1212" y="305" width="61" height="11" rx="6" fill="#54a8e9"/><text x="1100" y="350" class="t small">w₃ · behavior</text><rect x="1212" y="339" width="38" height="11" rx="6" fill="#f1b563"/><text x="1100" y="384" class="t small">w₄ · MM</text><rect x="1212" y="373" width="73" height="11" rx="6" fill="#a68af2"/><text x="1201" y="415" text-anchor="middle" class="t small">L2-normalized fused vector zᵢ</text></g>

  <rect x="58" y="548" width="1278" height="112" rx="18" fill="#102b42" stroke="#315b75"/>
  <text x="86" y="583" class="t" font-size="15" font-weight="750" letter-spacing="1.5" fill="#ffbd66">SELF-SUPERVISED TRAINING</text>
  <text x="86" y="618" class="t label">Hide one source</text><path d="M232 611L318 611" class="line"/><text x="338" y="618" class="t label">Fuse the remaining sources</text><path d="M590 611L676 611" class="line"/><text x="696" y="618" class="t label">Reconstruct the held-out source</text><path d="M987 611L1072 611" class="line"/><text x="1092" y="618" class="t label">Cosine loss</text>
  <text x="86" y="646" class="t small">+ semantic anchor · confidence calibration · entropy floor · weak global balance</text>
  <text x="58" y="696" class="t small">Output: one standalone 128-D Parquet embedding per item → fixed DIN evaluation (A5)</text>
</svg>
